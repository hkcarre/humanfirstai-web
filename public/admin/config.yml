# Sveltia CMS: the editing screen at /admin. Every change is a commit to GitHub, and Netlify
# rebuilds the site in about a minute. Field names must match src/content.config.ts.

backend:
  name: github
  repo: hkcarre/humanfirstai-web
  branch: main
  base_url: https://api.netlify.com # Netlify signs editors in with GitHub (Site settings > Access & security > OAuth)

site_url: https://humanfirstai-global.netlify.app
logo_url: /favicon.svg
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: events
    label: Events
    label_singular: Event
    description: Shown on the Events page. They move to "Already happened" on their own once the date passes. An event with no start date is shown as "to be announced".
    folder: src/content/events
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{title}} · {{city}} · {{start}}'
    sortable_fields: [start, title]
    fields:
      - { name: title, label: Title, widget: string, hint: 'Say plainly what it is, so someone who has never heard of us knows whether to come.' }
      - { name: titleEs, label: Title in Spanish, widget: string, required: false, hint: 'Leave empty and the Spanish page shows the English title.' }
      - { name: type, label: Type, widget: select, options: [Panel, Workshop, Talk, Social], default: Workshop }
      - { name: start, label: Starts, widget: datetime, required: false, hint: 'Leave empty until the date is fixed. The event is then shown as "to be announced".' }
      - { name: end, label: Ends, widget: datetime, required: false }
      - { name: place, label: Place, widget: string, required: false, hint: 'Name of the building, e.g. "Biblioteca Sant Antoni". Leave empty until it is fixed.' }
      - { name: city, label: City, widget: string }
      - { name: language, label: Language, widget: string, default: English }
      - { name: signupUrl, label: Sign-up link, widget: string, required: false, hint: 'Optional. A form or ticket link.' }
      - { name: draft, label: Hide from the site, widget: boolean, default: false }
      - { name: body, label: What happens, widget: markdown, hint: 'Two or three short sentences. What to bring, who it is for, how to get there.' }
      - { name: summaryEs, label: 'What happens, in Spanish', widget: text, required: false, hint: 'Plain text. Leave empty and the Spanish page shows the English text.' }

  - name: posts
    label: Blog
    label_singular: Post
    folder: src/content/posts
    create: true
    slug: '{{slug}}'
    summary: '{{title}} · {{author}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: subtitle, label: Subtitle, widget: string, required: false }
      - { name: author, label: Author, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false }
      - { name: externalUrl, label: 'Published elsewhere?', widget: string, required: false, hint: 'Paste a link only if the piece lives on another site. Leave empty to publish the text below here.' }
      - { name: titleEs, label: Title in Spanish, widget: string, required: false, hint: 'Only if a Spanish version of the piece exists. Needs the link below too. Otherwise the Spanish page lists the piece as "In English".' }
      - { name: subtitleEs, label: Subtitle in Spanish, widget: string, required: false }
      - { name: urlEs, label: Link to the Spanish version, widget: string, required: false }
      - { name: draft, label: Hide from the site, widget: boolean, default: false }
      - { name: body, label: Text, widget: markdown, required: false }

  - name: team
    label: Team
    label_singular: Person
    description: 'Our team, on the About page. Everyone gets the same card: a photo (or their initial until there is one), their name and a link. No titles.'
    folder: src/content/team
    create: true
    slug: '{{slug}}'
    summary: '{{name}}'
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Name, widget: string }
      - { name: photo, label: Photo, widget: image, required: false, hint: 'Square, at least 400px. Only use a photo the person has agreed to.' }
      - { name: photoAlt, label: Photo description, widget: string, required: false, hint: 'One sentence describing the photo, for people using screen readers.' }
      - { name: link, label: Link, widget: string, required: false, hint: 'LinkedIn or a personal site.' }
      - { name: order, label: Position on the page, widget: number, value_type: int, default: 99 }
      - { name: body, label: Short bio, widget: markdown, required: false, hint: 'One or two sentences, in your own words.' }

  - name: settings
    label: Settings
    files:
      - name: site
        label: Newsletter
        file: src/content/settings/site.json
        fields:
          - { name: newsletterUrl, label: Substack address, widget: string, required: false, hint: 'e.g. https://humanfirstai.substack.com. While empty, sign-ups are kept in Netlify under Forms > newsletter, ready to import into Substack. When you set this, update the Privacy pages too: they say no newsletter service is used yet.' }
          - { name: newsletterName, label: Newsletter name, widget: string }

  # Each page exists once per language. The Spanish files reuse the English fields.
  - name: pages
    label: Pages
    files:
      - name: home
        label: Home page · English
        file: src/content/pages/home.json
        fields: &home_fields
          - { name: headline, label: Headline, widget: string }
          - { name: headlineAccent, label: Headline second line (in orange), widget: string, required: false }
          - { name: standfirst, label: Text under the headline, widget: text }
          - { name: newsletterLabel, label: Sign-up line, widget: string, hint: 'The line above the email field. Say what people will hear about.' }
          - { name: newsletterButton, label: Sign-up button, widget: string }
          - { name: doorwaysTitle, label: Doorways heading, widget: string }
          - name: doorways
            label: The three doorways
            widget: list
            min: 3
            max: 3
            fields:
              - { name: word, label: Word on the door, widget: string, hint: 'One short word. It is drawn inside the arch.' }
              - { name: title, label: Heading, widget: string }
              - { name: body, label: Text, widget: text }
              - { name: linkLabel, label: Link text, widget: string }
              - { name: linkHref, label: Link goes to, widget: string }
          - { name: promisesTitle, label: Four statements heading, widget: string }
          - name: promises
            label: Four statements
            widget: list
            fields:
              - { name: title, label: Statement, widget: string }
              - { name: body, label: One line on what it means, widget: string }
          - { name: whyQuote, label: Big statement (dark band), widget: text }
          - { name: whyBody, label: Text beside it, widget: text }
          - { name: closing, label: Closing line, widget: string }
          - { name: closingLabel, label: Sign-up line at the bottom, widget: string }
      - name: home-es
        label: Home page · Español
        file: src/content/pages/home-es.json
        fields: *home_fields
      - name: about
        label: About page · English
        file: src/content/prose/about.md
        fields: &prose_fields
          - { name: title, label: Title, widget: string }
          - { name: intro, label: Intro, widget: text }
          - { name: body, label: Text, widget: markdown }
      - name: about-es
        label: About page · Español
        file: src/content/prose/about-es.md
        fields: *prose_fields
      - name: privacy
        label: Privacy page · English
        file: src/content/prose/privacy.md
        fields: &privacy_fields
          - { name: title, label: Title, widget: string }
          - { name: intro, label: Intro, widget: text }
          - { name: updated, label: Last updated, widget: datetime, time_format: false, hint: 'Change this whenever the text changes.' }
          - { name: unreviewed, label: 'Show the "draft, not yet checked" note', widget: boolean, default: true, hint: 'Switch off once the team has checked the text and filled in who is responsible.' }
          - { name: body, label: Text, widget: markdown }
      - name: privacy-es
        label: Privacy page · Español
        file: src/content/prose/privacy-es.md
        fields: *privacy_fields
